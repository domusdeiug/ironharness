services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./app:/app/app
      - ./config.yaml:/app/config.yaml
    depends_on:
      - redis

  worker:
    build: .
    command: sh -c "python -m app.worker && rq worker thea-pipeline --url $${REDIS_URL}"
    env_file: .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./app:/app/app
      - ./config.yaml:/app/config.yaml
    depends_on:
      - redis