; supervisord.conf — runs the FastAPI app and the RQ worker as two
; processes inside a single container, so web + worker collapse into one
; Railway service. Redis is unaffected: it stays the existing managed
; Railway Redis addon, reached via REDIS_URL exactly as before.
;
; Place this file at the repo root (thea-backend/supervisord.conf); the
; Dockerfile COPYs it to /app/supervisord.conf and launches supervisord
; instead of uvicorn directly.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; --- API (uvicorn) -------------------------------------------------------
; Command matches the Dockerfile's previous CMD verbatim.
[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; --- worker (RQ) -----------------------------------------------------------
; Command matches docker-compose.yml's `worker` service verbatim:
;   sh -c "python -m app.worker && rq worker thea-pipeline --url $REDIS_URL"
; REDIS_URL is unchanged — still points at Railway's managed Redis addon.
[program:worker]
command=sh -c "python -m app.worker && rq worker thea-pipeline --url $REDIS_URL"
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
